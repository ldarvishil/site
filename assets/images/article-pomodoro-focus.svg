<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" direction="rtl">
  <rect width="640" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="320" y="34" text-anchor="middle" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14.5" font-weight="800">ساختار چرخه تمرکز پومودورو + قانون ۲۰-۲۰-۲۰ رفع خستگی چشم</text>

  <!-- Right Card: 25 Min Deep Focus -->
  <rect x="332" y="56" width="284" height="178" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <circle cx="572" cy="92" r="22" fill="#0f172a" />
  <text x="572" y="97" text-anchor="middle" fill="#fde68a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۲۵′</text>
  <text x="536" y="88" text-anchor="start" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="800">گام اول: ۲۵ دقیقه تمرکز عمیق</text>
  <text x="536" y="108" text-anchor="start" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="600">مطالعه با هدایتگر دیداری و تایمر</text>

  <rect x="350" y="128" width="248" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="584" y="153" text-anchor="start" fill="#334155" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">✓ ثبت افکار مزاحم روی «برگه تخلیه ذهن»</text>

  <rect x="350" y="178" width="248" height="40" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="584" y="203" text-anchor="start" fill="#334155" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">✓ قطع کامل اعلان‌های گوشی موبایل</text>

  <!-- Left Card: 5 Min Active Recovery -->
  <rect x="24" y="56" width="284" height="178" rx="12" fill="#ffffff" stroke="#047857" stroke-width="2" />
  <circle cx="264" cy="92" r="22" fill="#047857" />
  <text x="264" y="97" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۵′</text>
  <text x="228" y="88" text-anchor="start" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="800">گام دوم: ۵ دقیقه ریکاوری مغز و چشم</text>
  <text x="228" y="108" text-anchor="start" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="600">بازسازی ذخایر انرژی سیناپسی</text>

  <rect x="42" y="128" width="248" height="40" rx="6" fill="#ecfdf5" stroke="#a7f3d0" />
  <text x="276" y="153" text-anchor="start" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">✓ قانون ۲۰-۲۰-۲۰: نگاه به فاصله ۶ متری</text>

  <rect x="42" y="178" width="248" height="40" rx="6" fill="#fef3c7" stroke="#fde68a" />
  <text x="276" y="203" text-anchor="start" fill="#78350f" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">✗ ممنوعیت چک کردن شبکه‌های اجتماعی</text>

  <!-- Bottom Banner -->
  <rect x="24" y="248" width="592" height="36" rx="8" fill="#fef3c7" stroke="#fde68a" />
  <text x="320" y="271" text-anchor="middle" fill="#78350f" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="800">پس از ۴ پومودورو (۲ ساعت مطالعه باکیفیت): ۲۰ تا ۳۰ دقیقه استراحت کامل</text>
</svg>
