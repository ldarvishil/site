<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="focusArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="restArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" fill-opacity="0.35" />
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgPom)" />
  <rect width="800" height="450" rx="16" fill="url(#dotGrid)" />

  <!-- Left Precision Chronometer (25/5 Cycle Ring) -->
  <g transform="translate(230, 225)">
    <circle cx="0" cy="0" r="142" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <circle cx="0" cy="0" r="115" fill="none" stroke="#f1f5f9" stroke-width="22" />

    <!-- 25-Min Deep Focus Segment (Approx 300 degrees of ring) -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#focusArc)" stroke-width="22" stroke-dasharray="600 722" stroke-dashoffset="180" stroke-linecap="round" transform="rotate(-90)" />

    <!-- 5-Min Rest & Consolidation Segment (Approx 50 degrees of ring) -->
    <circle cx="0" cy="0" r="115" fill="none" stroke="url(#restArc)" stroke-width="22" stroke-dasharray="95 722" stroke-dashoffset="-432" stroke-linecap="round" transform="rotate(-90)" />

    <!-- Clock Tick Marks -->
    <g stroke="#64748b" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-84" x2="0" y2="-74" />
      <line x1="84" y1="0" x2="74" y2="0" />
      <line x1="0" y1="84" x2="0" y2="74" />
      <line x1="-84" y1="0" x2="-74" y2="0" />
      <line x1="59" y1="-59" x2="52" y2="-52" />
      <line x1="59" y1="59" x2="52" y2="52" />
      <line x1="-59" y1="59" x2="-52" y2="52" />
      <line x1="-59" y1="-59" x2="-52" y2="-52" />
    </g>

    <!-- Watch Hands & Center Pivot -->
    <line x1="0" y1="0" x2="-38" y2="-52" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="56" y2="-18" stroke="#047857" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="0" r="9" fill="#0f172a" />
    <circle cx="0" cy="0" r="4" fill="#10b981" />
  </g>

  <!-- Right Panel: 4-Block Cognitive Energy Sustain vs Burnout Comparison -->
  <g transform="translate(430, 82)">
    <rect x="0" y="0" width="305" height="286" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

    <!-- 4 Pomodoro Sprint Blocks + Recovery Nodes -->
    <g transform="translate(28, 38)">
      <!-- Sprint 1 -->
      <rect x="0" y="0" width="48" height="76" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
      <rect x="12" y="48" width="24" height="16" rx="3" fill="#34d399" opacity="0.8" />
      <!-- Short Rest 1 -->
      <rect x="54" y="22" width="10" height="54" rx="5" fill="#f59e0b" />

      <!-- Sprint 2 -->
      <rect x="70" y="0" width="48" height="76" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
      <rect x="82" y="48" width="24" height="16" rx="3" fill="#34d399" opacity="0.8" />
      <!-- Short Rest 2 -->
      <rect x="124" y="22" width="10" height="54" rx="5" fill="#f59e0b" />

      <!-- Sprint 3 -->
      <rect x="140" y="0" width="48" height="76" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
      <rect x="152" y="48" width="24" height="16" rx="3" fill="#34d399" opacity="0.8" />
      <!-- Short Rest 3 -->
      <rect x="194" y="22" width="10" height="54" rx="5" fill="#f59e0b" />

      <!-- Sprint 4 -->
      <rect x="210" y="0" width="38" height="76" rx="8" fill="#065f46" stroke="#10b981" stroke-width="1.5" />
      <rect x="219" y="48" width="20" height="16" rx="3" fill="#34d399" opacity="0.8" />
    </g>

    <!-- Cognitive Stamina Wave Comparison -->
    <g transform="translate(28, 148)">
      <rect x="0" y="0" width="248" height="104" rx="10" fill="#1e293b" />
      <!-- High Sustained Focus Wave (Green) -->
      <path d="M 16 36 Q 42 22 68 38 L 78 28 Q 104 18 130 36 L 140 26 Q 166 18 192 34 L 202 24 Q 220 18 234 28" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" />
      <!-- Continuous Marathon Fatigue Drop (Red Dashed) -->
      <path d="M 16 36 C 65 40, 115 78, 234 90" fill="none" stroke="#f87171" stroke-width="2.2" stroke-dasharray="5 4" stroke-linecap="round" />
      <circle cx="234" cy="28" r="5" fill="#10b981" />
      <circle cx="234" cy="90" r="5" fill="#ef4444" />
    </g>
  </g>
</svg>
