<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" direction="rtl">
  <defs>
    <filter id="cardDrop" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="520" rx="16" fill="#f1f5f9" />

  <!-- Worksheet Card -->
  <g filter="url(#cardDrop)">
    <rect x="24" y="20" width="752" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Top Banner -->
  <rect x="44" y="36" width="712" height="40" rx="8" fill="#0f172a" />
  <text x="738" y="61" text-anchor="start" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="800">کاربرگ مقایسه حرکت چشم (Eye-Tracking) · تمرین عبارت‌خوانی و خط‌بری دیداری</text>
  <text x="62" y="61" text-anchor="end" fill="#fde68a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">نیما صابری · پژوهشگر دکتری (۱۴۰ ← ۴۱۰ WPM)</text>

  <!-- PANEL 1: BEFORE (Traditional Word-by-Word + Regressions) -->
  <rect x="44" y="92" width="712" height="178" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
  <rect x="60" y="106" width="290" height="28" rx="6" fill="#b91c1c" />
  <text x="205" y="125" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="800">۱. قبل از دوره: کلمه‌خوانی سنتی (۱۱ توقف + برگشت چشم)</text>
  <text x="78" y="125" text-anchor="end" fill="#991b1b" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="800">سرعت: ۱۴۰ کلمه/دقیقه | خستگی زودرس چشم</text>

  <!-- Simulated Text Line with 10 Red Fixation Stops & Regression Loops -->
  <text x="726" y="176" text-anchor="start" fill="#334155" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15" font-weight="700">پژوهش‌های   نوین   علوم   اعصاب   نشان   می‌دهد   که   قشر   بینایی   مغز   انسان</text>

  <!-- Red Fixation Dots on every word -->
  <g fill="#dc2626" fill-opacity="0.22" stroke="#b91c1c" stroke-width="1.8">
    <circle cx="696" cy="171" r="14" />
    <circle cx="630" cy="171" r="12" />
    <circle cx="582" cy="171" r="12" />
    <circle cx="530" cy="171" r="14" />
    <circle cx="476" cy="171" r="12" />
    <circle cx="420" cy="171" r="14" />
    <circle cx="372" cy="171" r="11" />
    <circle cx="332" cy="171" r="12" />
    <circle cx="280" cy="171" r="14" />
    <circle cx="228" cy="171" r="12" />
    <circle cx="176" cy="171" r="13" />
  </g>

  <!-- Backward Regression Arcs -->
  <path d="M 420 154 Q 475 130, 530 154" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3" />
  <polygon points="530,154 522,148 525,158" fill="#b91c1c" />
  <text x="475" y="140" text-anchor="middle" fill="#b91c1c" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="700">برگشت ناخودآگاه نگاه (Regression)</text>

  <path d="M 228 154 Q 280 132, 332 154" fill="none" stroke="#b91c1c" stroke-width="2" stroke-dasharray="4 3" />
  <polygon points="332,154 324,148 327,158" fill="#b91c1c" />

  <text x="726" y="246" text-anchor="start" fill="#7f1d1d" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="600">علت کندی: تلفظ صوتی تک‌تک واژه‌ها در ذهن (Subvocalization) و پرش افکار در فاصله بین مکث‌های طولانی.</text>

  <!-- PANEL 2: AFTER (Phrase Chunking + Visual Pacer) -->
  <rect x="44" y="286" width="712" height="194" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
  <rect x="426" y="300" width="314" height="28" rx="6" fill="#047857" />
  <text x="583" y="319" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="800">۲. پس از دوره: دریافت بسته‌ای (فقط ۳ مکث در کل سطر)</text>
  <text x="78" y="319" text-anchor="end" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="800">سرعت: ۴۱۰ کلمه/دقیقه | درک مطلب: ۸۵٪+</text>

  <!-- 3 Semantic Chunk Boxes (RTL: Chunk 1 on Right, Chunk 2 in Center, Chunk 3 on Left) -->
  <!-- Chunk 1 -->
  <rect x="524" y="346" width="212" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2" stroke-dasharray="5 3" />
  <text x="630" y="374" text-anchor="middle" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14.5" font-weight="800">پژوهش‌های نوین علوم اعصاب</text>
  <circle cx="630" cy="346" r="10" fill="#047857" />
  <text x="630" y="350" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="800">۱</text>

  <!-- Chunk 2 -->
  <rect x="298" y="346" width="206" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2" stroke-dasharray="5 3" />
  <text x="401" y="374" text-anchor="middle" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14.5" font-weight="800">نشان می‌دهد که قشر بینایی</text>
  <circle cx="401" cy="346" r="10" fill="#047857" />
  <text x="401" y="350" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="800">۲</text>

  <!-- Chunk 3 -->
  <rect x="76" y="346" width="202" height="44" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2" stroke-dasharray="5 3" />
  <text x="177" y="374" text-anchor="middle" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14.5" font-weight="800">مغز انسان تصاویر را می‌فهمد</text>
  <circle cx="177" cy="346" r="10" fill="#047857" />
  <text x="177" y="350" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11" font-weight="800">۳</text>

  <!-- Smooth Visual Pacer Track & Pen Tip under Chunks -->
  <path d="M 710 412 L 105 412" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" />
  <polygon points="95,412 112,405 112,419" fill="#047857" />
  <!-- Sleek Pacer Pen Icon at Center -->
  <g transform="translate(385, 404)">
    <rect x="0" y="0" width="76" height="14" rx="4" fill="#0f172a" />
    <polygon points="0,7 -14,2 -14,12" fill="#f59e0b" />
    <text x="38" y="11" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5" font-weight="700">هدایتگر دیداری</text>
  </g>

  <text x="726" y="458" text-anchor="start" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="700">نتیجه عملی: کاهش ۷۰٪ حرکات اضافی چشم و مطالعه کامل مقالات و کتب مرجع در یک‌سوم زمان قبلی.</text>
</svg>
