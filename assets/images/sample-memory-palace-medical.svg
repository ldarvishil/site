<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" direction="rtl">
  <defs>
    <filter id="medShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.09" />
    </filter>
  </defs>

  <rect width="800" height="520" rx="16" fill="#f1f5f9" />

  <g filter="url(#medShadow)">
    <rect x="24" y="20" width="752" height="480" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
  </g>

  <!-- Header -->
  <rect x="44" y="36" width="712" height="40" rx="8" fill="#0f172a" />
  <text x="738" y="61" text-anchor="start" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13.5" font-weight="800">کاربرگ کاخ حافظه (Loci) + جدول مرورهای طلایی ابینگهاوس · علوم پایه پزشکی</text>
  <text x="62" y="61" text-anchor="end" fill="#fde68a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">علیرضا نادری · دانشجوی پزشکی (ماندگاری ۸۸٪+)</text>

  <!-- RIGHT COLUMN: 4 Memory Palace Stations (کاخ حافظه فضایی) -->
  <rect x="408" y="92" width="348" height="386" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="736" y="122" text-anchor="start" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="800">بخش اول: کدگذاری فضایی در کاخ حافظه (۴ ایستگاه)</text>
  <text x="736" y="142" text-anchor="start" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="600">مبحث: فارماکولوژی سیستم عصبی خودمختار (ANS)</text>

  <!-- Station 1 -->
  <rect x="426" y="158" width="312" height="64" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="1.8" />
  <circle cx="712" cy="190" r="15" fill="#fef3c7" stroke="#b45309" stroke-width="1.8" />
  <text x="712" y="195" text-anchor="middle" fill="#78350f" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۱</text>
  <text x="684" y="182" text-anchor="start" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="800">ایستگاه ۱ (ورودی اتاق): گیرنده‌های موسکارینی</text>
  <text x="684" y="204" text-anchor="start" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="600">تصویر کلیدی: M1 (مغز) · M2 (قلب) · M3 (غدد و عضلات صاف)</text>

  <!-- Station 2 -->
  <rect x="426" y="234" width="312" height="64" rx="8" fill="#ffffff" stroke="#047857" stroke-width="1.8" />
  <circle cx="712" cy="266" r="15" fill="#ecfdf5" stroke="#047857" stroke-width="1.8" />
  <text x="712" y="271" text-anchor="middle" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۲</text>
  <text x="684" y="258" text-anchor="start" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="800">ایستگاه ۲ (میز مطالعه): گیرنده‌های آدرنرژیک</text>
  <text x="684" y="280" text-anchor="start" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="600">تصویر کلیدی: آلفا ۱ (انقباض عروق) · بتا ۱ (قلب) · بتا ۲ (برونش)</text>

  <!-- Station 3 -->
  <rect x="426" y="310" width="312" height="64" rx="8" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.8" />
  <circle cx="712" cy="342" r="15" fill="#eff6ff" stroke="#1e3a8a" stroke-width="1.8" />
  <text x="712" y="347" text-anchor="middle" fill="#1e3a8a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۳</text>
  <text x="684" y="334" text-anchor="start" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="800">ایستگاه ۳ (کتابخانه): مهارکننده‌های کولین‌استراز</text>
  <text x="684" y="356" text-anchor="start" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="600">تصویر کلیدی: نئوستیگمین · فیزوستیگمین · پیریدوستیگمین</text>

  <!-- Station 4 -->
  <rect x="426" y="386" width="312" height="72" rx="8" fill="#ffffff" stroke="#7c2d12" stroke-width="1.8" />
  <circle cx="712" cy="422" r="15" fill="#fff7ed" stroke="#7c2d12" stroke-width="1.8" />
  <text x="712" y="427" text-anchor="middle" fill="#7c2d12" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۴</text>
  <text x="684" y="412" text-anchor="start" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="800">ایستگاه ۴ (پنجره): آنتاگونیست‌های بتا (بتابلاکرها)</text>
  <text x="684" y="434" text-anchor="start" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="600">تصویر کلیدی: پروپرانولول (غیراختصاصی) · متوپرولول (اختصاصی B1)</text>

  <!-- LEFT COLUMN: Ebbinghaus Spaced Repetition Tracker -->
  <rect x="44" y="92" width="344" height="386" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text x="368" y="122" text-anchor="start" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14" font-weight="800">بخش دوم: کارت پایش ۴ مرور طلایی ابینگهاوس</text>
  <text x="368" y="142" text-anchor="start" fill="#475569" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="600">مجموع زمان ۴ مرور: فقط ۱۳ دقیقه در طول یک ماه</text>

  <!-- Review Checkrows -->
  <g font-family="Vazirmatn, Tahoma, sans-serif">
    <rect x="62" y="160" width="308" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" />
    <text x="354" y="182" text-anchor="start" fill="#065f46" font-size="12.5" font-weight="800">مرور اول: ۲۰ دقیقه پس از پایان مطالعه</text>
    <text x="354" y="200" text-anchor="start" fill="#047857" font-size="11" font-weight="600">مدت: ۳ دقیقه اسکن تصویری کاخ حافظه · تثبیت ۹۵٪</text>
    <text x="88" y="190" text-anchor="middle" fill="#047857" font-size="16" font-weight="800">✓</text>

    <rect x="62" y="218" width="308" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" />
    <text x="354" y="240" text-anchor="start" fill="#065f46" font-size="12.5" font-weight="800">مرور دوم: ۲۴ ساعت بعد (فردای مطالعه)</text>
    <text x="354" y="258" text-anchor="start" fill="#047857" font-size="11" font-weight="600">مدت: ۵ دقیقه بازیابی فعال ایستگاه‌ها · تثبیت ۹۰٪</text>
    <text x="88" y="248" text-anchor="middle" fill="#047857" font-size="16" font-weight="800">✓</text>

    <rect x="62" y="276" width="308" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" />
    <text x="354" y="298" text-anchor="start" fill="#065f46" font-size="12.5" font-weight="800">مرور سوم: ۷ روز بعد (پایان هفته اول)</text>
    <text x="354" y="316" text-anchor="start" fill="#047857" font-size="11" font-weight="600">مدت: ۳ دقیقه مرور شاخه‌های کلیدی · تثبیت ۸۸٪</text>
    <text x="88" y="306" text-anchor="middle" fill="#047857" font-size="16" font-weight="800">✓</text>

    <rect x="62" y="334" width="308" height="48" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5" />
    <text x="354" y="356" text-anchor="start" fill="#065f46" font-size="12.5" font-weight="800">مرور چهارم: ۳۰ روز بعد (تثبیت بلندمدت)</text>
    <text x="354" y="374" text-anchor="start" fill="#047857" font-size="11" font-weight="600">مدت: ۲ دقیقه مرور سریع پیش از آزمون · تثبیت دائمی</text>
    <text x="88" y="364" text-anchor="middle" fill="#047857" font-size="16" font-weight="800">✓</text>
  </g>

  <!-- Summary Stamp -->
  <rect x="62" y="396" width="308" height="62" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5" />
  <text x="216" y="421" text-anchor="middle" fill="#78350f" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="800">نتیجه در شب امتحان علوم پایه پزشکی:</text>
  <text x="216" y="443" text-anchor="middle" fill="#92400e" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">تسلط کامل بر داروها بدون استرس و بدون نیاز به شب‌بیداری</text>
</svg>
