<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgEbb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f6" />
    </linearGradient>
    <linearGradient id="retentionArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="decayArea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.0" />
    </linearGradient>
    <pattern id="chartGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#cbd5e1" stroke-width="0.7" stroke-opacity="0.5" />
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgEbb)" />

  <!-- Chart Frame -->
  <g transform="translate(70, 55)">
    <rect x="0" y="0" width="660" height="340" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="40" y="30" width="580" height="260" fill="url(#chartGrid)" />

    <!-- Horizontal Reference Guides (100%, 75%, 50%, 20%) -->
    <line x1="40" y1="45" x2="620" y2="45" stroke="#10b981" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.6" />
    <line x1="40" y1="115" x2="620" y2="115" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5" stroke-opacity="0.45" />
    <line x1="40" y1="185" x2="620" y2="185" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 5" stroke-opacity="0.45" />
    <line x1="40" y1="255" x2="620" y2="255" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 4" stroke-opacity="0.45" />

    <!-- Vertical Spaced Repetition Interval Pillars (1h, 24h, 7d, 30d) -->
    <line x1="145" y1="30" x2="145" y2="290" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.45" />
    <line x1="275" y1="30" x2="275" y2="290" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.45" />
    <line x1="430" y1="30" x2="430" y2="290" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.45" />
    <line x1="585" y1="30" x2="585" y2="290" stroke="#047857" stroke-width="1.5" stroke-dasharray="3 4" stroke-opacity="0.45" />

    <!-- Unreviewed Exponential Decay Area & Curve (Red/Amber) -->
    <path d="M 40 45 C 85 190, 180 245, 620 268 L 620 290 L 40 290 Z" fill="url(#decayArea)" />
    <path d="M 40 45 C 85 190, 180 245, 620 268" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="7 5" />

    <!-- Spaced Repetition Sawtooth Consolidation Area & Curve (Emerald) -->
    <path d="M 40 45
             C 75 88, 115 112, 145 122
             L 145 45
             C 190 74, 235 94, 275 104
             L 275 45
             C 330 64, 385 78, 430 85
             L 430 45
             C 490 54, 545 60, 585 64
             L 585 45
             L 620 49
             L 620 290 L 40 290 Z" fill="url(#retentionArea)" />

    <path d="M 40 45
             C 75 88, 115 112, 145 122
             L 145 45
             C 190 74, 235 94, 275 104
             L 275 45
             C 330 64, 385 78, 430 85
             L 430 45
             C 490 54, 545 60, 585 64
             L 585 45
             L 620 49" fill="none" stroke="#047857" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Axes -->
    <line x1="40" y1="30" x2="40" y2="290" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <line x1="40" y1="290" x2="620" y2="290" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Golden Review Node Markers -->
    <g>
      <circle cx="40" cy="45" r="7" fill="#0f172a" stroke="#ffffff" stroke-width="2" />

      <circle cx="145" cy="122" r="5" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
      <circle cx="145" cy="45" r="8" fill="#047857" stroke="#ffffff" stroke-width="2.5" />

      <circle cx="275" cy="104" r="5" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
      <circle cx="275" cy="45" r="8" fill="#047857" stroke="#ffffff" stroke-width="2.5" />

      <circle cx="430" cy="85" r="5" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
      <circle cx="430" cy="45" r="8" fill="#047857" stroke="#ffffff" stroke-width="2.5" />

      <circle cx="585" cy="64" r="5" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
      <circle cx="585" cy="45" r="9" fill="#10b981" stroke="#0f172a" stroke-width="2.5" />

      <!-- Decay Bottom Node -->
      <circle cx="585" cy="266" r="6" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Bottom Interval Visual Indicators (Progress Bars instead of text) -->
    <g transform="translate(40, 306)">
      <rect x="85" y="0" width="40" height="8" rx="4" fill="#047857" opacity="0.5" />
      <rect x="215" y="0" width="40" height="8" rx="4" fill="#047857" opacity="0.68" />
      <rect x="370" y="0" width="40" height="8" rx="4" fill="#047857" opacity="0.85" />
      <rect x="525" y="0" width="40" height="8" rx="4" fill="#10b981" />
    </g>
  </g>
</svg>
