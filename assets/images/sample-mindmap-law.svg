<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" direction="rtl">
  <defs>
    <pattern id="dotGridLaw" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.1" fill="#cbd5e1" opacity="0.75" />
    </pattern>
    <filter id="paperShadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.1" />
    </filter>
    <filter id="noteShadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#78350f" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Desk Surface Background -->
  <rect width="800" height="520" rx="16" fill="#f1f5f9" />

  <!-- Notebook Page Sheet (Landscape A4) -->
  <g filter="url(#paperShadow)">
    <rect x="26" y="22" width="748" height="476" rx="12" fill="#fffdf8" stroke="#cbd5e1" stroke-width="1.5" />
    <rect x="34" y="30" width="716" height="460" rx="8" fill="url(#dotGridLaw)" />
  </g>

  <!-- Right Spiral Binder Rings (RTL Notebook Spine) -->
  <g fill="#94a3b8" stroke="#475569" stroke-width="1">
    <rect x="756" y="58" width="24" height="8" rx="4" />
    <rect x="756" y="108" width="24" height="8" rx="4" />
    <rect x="756" y="158" width="24" height="8" rx="4" />
    <rect x="756" y="208" width="24" height="8" rx="4" />
    <rect x="756" y="258" width="24" height="8" rx="4" />
    <rect x="756" y="308" width="24" height="8" rx="4" />
    <rect x="756" y="358" width="24" height="8" rx="4" />
    <rect x="756" y="408" width="24" height="8" rx="4" />
    <rect x="756" y="458" width="24" height="8" rx="4" />
  </g>

  <!-- Top Header Metadata Bar inside Notebook -->
  <rect x="48" y="36" width="690" height="36" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
  <text x="724" y="59" text-anchor="start" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">نمونه واقعی نقشه ذهنی (Mind Map) · درس حقوق مدنی ۳ (کلیات عقود و تعهدات)</text>
  <text x="64" y="59" text-anchor="end" fill="#047857" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">خلاصه‌سازی ۴۲ صفحه در ۱ برگ افقی ✓</text>

  <!-- ORGANIC RADIAL BRANCHES (Tony Buzan Style) -->
  <!-- Branch 1: Top-Right (Amber - ماده ۱۹۰ شرایط صحت) -->
  <path d="M 465 250 C 515 205, 545 145, 615 135" fill="none" stroke="#b45309" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 615 135 C 650 132, 680 105, 725 102" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
  <path d="M 615 135 C 650 142, 680 155, 725 158" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
  <path d="M 615 135 C 645 168, 675 202, 725 206" fill="none" stroke="#d97706" stroke-width="3" stroke-linecap="round" />

  <!-- Branch 2: Bottom-Right (Emerald - اقسام عقود) -->
  <path d="M 465 282 C 520 325, 555 375, 620 385" fill="none" stroke="#047857" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 620 385 C 655 375, 685 352, 728 348" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M 620 385 C 655 395, 685 405, 728 405" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />
  <path d="M 620 385 C 650 422, 682 452, 728 456" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" />

  <!-- Branch 3: Top-Left (Deep Navy - آثار قراردادها) -->
  <path d="M 335 250 C 285 205, 255 145, 190 135" fill="none" stroke="#1e3a8a" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 190 135 C 155 128, 125 102, 72 98" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
  <path d="M 190 135 C 155 145, 125 156, 72 156" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
  <path d="M 190 135 C 155 175, 125 205, 72 208" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />

  <!-- Branch 4: Bottom-Left (Crimson - سقوط تعهدات م ۲۶۴) -->
  <path d="M 335 282 C 285 325, 255 370, 190 380" fill="none" stroke="#991b1b" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 190 380 C 155 365, 125 342, 72 338" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
  <path d="M 190 380 C 155 388, 125 396, 72 396" fill="none" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />

  <!-- Branch 1 Nodes (Top-Right: شرایط اساسی صحت م.۱۹۰) -->
  <rect x="525" y="114" width="128" height="34" rx="17" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
  <text x="589" y="136" text-anchor="middle" fill="#78350f" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۱. شرایط صحت (م.۱۹۰)</text>

  <text x="720" y="95" text-anchor="start" fill="#92400e" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">• قصد و رضای طرفین</text>
  <text x="720" y="150" text-anchor="start" fill="#92400e" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">• اهلیت قانونی (بلوغ، عقل، رشد)</text>
  <text x="720" y="198" text-anchor="start" fill="#92400e" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">• موضوع معین + جهت مشروع</text>

  <!-- Branch 2 Nodes (Bottom-Right: اقسام عقود) -->
  <rect x="530" y="366" width="122" height="34" rx="17" fill="#ecfdf5" stroke="#047857" stroke-width="2" />
  <text x="591" y="388" text-anchor="middle" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۲. اقسام عقود</text>

  <text x="722" y="340" text-anchor="start" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">• لازم و جایز (م.۱۸۵ و ۱۸۶)</text>
  <text x="722" y="397" text-anchor="start" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">• معوض و مجانی</text>
  <text x="722" y="448" text-anchor="start" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">• عینی، رضایی و تشریفاتی</text>

  <!-- Branch 3 Nodes (Top-Left: آثار قراردادها) -->
  <rect x="145" y="114" width="125" height="34" rx="17" fill="#eff6ff" stroke="#1e3a8a" stroke-width="2" />
  <text x="207" y="136" text-anchor="middle" fill="#1e3a8a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۳. آثار قراردادها</text>

  <text x="150" y="92" text-anchor="end" fill="#1e3a8a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">اصل لزوم (م.۲۱۹) •</text>
  <text x="150" y="148" text-anchor="end" fill="#1e3a8a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">اصل نسبی بودن (م.۲۳۱) •</text>
  <text x="150" y="200" text-anchor="end" fill="#1e3a8a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">تعهد به نفع ثالث (م.۱۹۶) •</text>

  <!-- Branch 4 Nodes (Bottom-Left: سقوط تعهدات م.۲۶۴) -->
  <rect x="142" y="362" width="132" height="34" rx="17" fill="#fef2f2" stroke="#991b1b" stroke-width="2" />
  <text x="208" y="384" text-anchor="middle" fill="#991b1b" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">۴. سقوط تعهدات (م.۲۶۴)</text>

  <text x="148" y="330" text-anchor="end" fill="#991b1b" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">وفای به عهد، اقاله، ابراء •</text>
  <text x="148" y="388" text-anchor="end" fill="#991b1b" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="700">تبدیل تعهد، تهاتر، مالکیت ما فی‌الذمه •</text>

  <!-- CENTRAL CORE NODE -->
  <g filter="url(#paperShadow)">
    <ellipse cx="400" cy="266" rx="84" ry="44" fill="#0f172a" stroke="#f59e0b" stroke-width="3.5" />
    <text x="400" y="261" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="15" font-weight="800">کلیات عقود و تعهدات</text>
    <text x="400" y="283" text-anchor="middle" fill="#fde68a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">مواد ۱۸۳ تا ۳۰0 قانون مدنی</text>
  </g>

  <!-- Bottom-Left Sticky Note: Review & Speed Benchmark -->
  <g filter="url(#noteShadow)">
    <rect x="48" y="424" width="330" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" />
    <text x="364" y="446" text-anchor="start" fill="#78350f" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12" font-weight="800">نتیجه محمدرضا کاظمی (داوطلب آزمون وکالت):</text>
    <text x="364" y="467" text-anchor="start" fill="#92400e" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">سرعت مطالعه: ۱۸۰ ← ۵۴۰ کلمه/دقیقه | مرور کل مبحث در ۴ دقیقه</text>
  </g>
</svg>
