<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" direction="rtl">
  <rect width="640" height="300" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <text x="320" y="34" text-anchor="middle" fill="#0f172a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="14.5" font-weight="800">مقایسه خلاصه‌نویسی خطی سنتی با نقشه‌برداری ذهنی شعاعی (Mind Map)</text>

  <!-- Right Side: Traditional Linear Notes (Crossed out / Inefficient) -->
  <rect x="332" y="54" width="284" height="182" rx="10" fill="#fef2f2" stroke="#fecaca" stroke-width="1.5" />
  <text x="474" y="80" text-anchor="middle" fill="#991b1b" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">خلاصه‌نویسی خطی سنتی (رونویسی)</text>

  <!-- Stack of monotonous lined pages -->
  <rect x="372" y="94" width="204" height="90" rx="6" fill="#ffffff" stroke="#cbd5e1" />
  <line x1="388" y1="112" x2="560" y2="112" stroke="#94a3b8" stroke-width="3" />
  <line x1="388" y1="126" x2="560" y2="126" stroke="#cbd5e1" stroke-width="3" />
  <line x1="388" y1="140" x2="560" y2="140" stroke="#94a3b8" stroke-width="3" />
  <line x1="388" y1="154" x2="560" y2="154" stroke="#cbd5e1" stroke-width="3" />
  <line x1="388" y1="168" x2="520" y2="168" stroke="#94a3b8" stroke-width="3" />

  <text x="474" y="206" text-anchor="middle" fill="#991b1b" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">• درگیری صرفاً نیمکره چپ (یکنواخت و خسته‌کننده)</text>
  <text x="474" y="224" text-anchor="middle" fill="#991b1b" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">• ۳۰ صفحه جزوه برای هر کتاب (مرور زمان‌بر)</text>

  <!-- Left Side: Radial Mind Map (1-Page Synthesis) -->
  <rect x="24" y="54" width="284" height="182" rx="10" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5" />
  <text x="166" y="80" text-anchor="middle" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="13" font-weight="800">نقشه ذهنی شعاعی (Mind Map)</text>

  <!-- Mini Radial Map Canvas -->
  <rect x="64" y="94" width="204" height="90" rx="6" fill="#ffffff" stroke="#047857" stroke-width="1.5" />
  <path d="M 166 139 C 195 118, 215 110, 244 110" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
  <path d="M 166 139 C 195 158, 215 166, 244 166" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" />
  <path d="M 166 139 C 135 118, 115 110, 88 110" fill="none" stroke="#1e3a8a" stroke-width="3" stroke-linecap="round" />
  <path d="M 166 139 C 135 158, 115 166, 88 166" fill="none" stroke="#991b1b" stroke-width="3" stroke-linecap="round" />
  <ellipse cx="166" cy="139" rx="28" ry="15" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
  <text x="166" y="143" text-anchor="middle" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="9.5" font-weight="800">ایده مرکز</text>

  <text x="166" y="206" text-anchor="middle" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">✓ هم‌افزایی دو نیمکره مغز (رنگ + کلیدواژه + تصویر)</text>
  <text x="166" y="224" text-anchor="middle" fill="#065f46" font-family="Vazirmatn, Tahoma, sans-serif" font-size="11.5" font-weight="700">✓ خلاصه کل فصل در ۱ صفحه افقی (مرور ۳ دقیقه‌ای)</text>

  <!-- Bottom Banner -->
  <rect x="24" y="248" width="592" height="36" rx="8" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="320" y="271" text-anchor="middle" fill="#1e3a8a" font-family="Vazirmatn, Tahoma, sans-serif" font-size="12.5" font-weight="800">قانون طلایی: روی هر شاخه فقط «یک کلیدواژه کانونی» بنویسید تا مغز روابط معنایی را فعالانه بسازد.</text>
</svg>
