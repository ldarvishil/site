<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMind" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2f6" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <pattern id="mindGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#cbd5e1" />
    </pattern>
  </defs>

  <rect width="800" height="450" rx="16" fill="url(#bgMind)" />
  <rect width="800" height="450" rx="16" fill="url(#mindGrid)" />
  <circle cx="400" cy="225" r="210" fill="url(#coreGlow)" />

  <!-- Organic Radiant Neural Branches -->
  <!-- Branch 1: Top-Right (Emerald) -->
  <path d="M 400 225 C 455 210, 495 145, 565 120" fill="none" stroke="#047857" stroke-width="7" stroke-linecap="round" />
  <path d="M 565 120 C 605 108, 635 82, 680 78" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" />
  <path d="M 565 120 C 610 125, 640 142, 685 145" fill="none" stroke="#34d399" stroke-width="3.5" stroke-linecap="round" />

  <!-- Branch 2: Bottom-Right (Amber/Ochre) -->
  <path d="M 400 225 C 460 240, 500 305, 570 330" fill="none" stroke="#b45309" stroke-width="7" stroke-linecap="round" />
  <path d="M 570 330 C 615 342, 645 315, 690 312" fill="none" stroke="#d97706" stroke-width="4" stroke-linecap="round" />
  <path d="M 570 330 C 610 350, 645 375, 685 378" fill="none" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />

  <!-- Branch 3: Top-Left (Blue/Indigo) -->
  <path d="M 400 225 C 345 210, 305 145, 235 120" fill="none" stroke="#1d4ed8" stroke-width="7" stroke-linecap="round" />
  <path d="M 235 120 C 195 108, 165 82, 120 78" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
  <path d="M 235 120 C 190 125, 160 142, 115 145" fill="none" stroke="#60a5fa" stroke-width="3.5" stroke-linecap="round" />

  <!-- Branch 4: Bottom-Left (Purple/Violet) -->
  <path d="M 400 225 C 340 240, 300 305, 230 330" fill="none" stroke="#6d28d9" stroke-width="7" stroke-linecap="round" />
  <path d="M 230 330 C 185 342, 155 315, 110 312" fill="none" stroke="#8b5cf6" stroke-width="4" stroke-linecap="round" />
  <path d="M 230 330 C 190 350, 155 375, 115 378" fill="none" stroke="#a78bfa" stroke-width="3.5" stroke-linecap="round" />

  <!-- Cross-Association Dotted Neural Bridge -->
  <path d="M 565 120 Q 400 45 235 120" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.6" />
  <path d="M 230 330 Q 400 405 570 330" fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 5" opacity="0.6" />

  <!-- Primary Branch Nodes with Visual Icons -->
  <!-- Top-Right Node -->
  <g transform="translate(565, 120)">
    <rect x="-36" y="-22" width="72" height="44" rx="10" fill="#ffffff" stroke="#047857" stroke-width="2.5" />
    <rect x="-20" y="-6" width="40" height="6" rx="3" fill="#047857" />
    <rect x="-14" y="4" width="28" height="5" rx="2.5" fill="#6ee7b7" />
  </g>
  <circle cx="680" cy="78" r="10" fill="#10b981" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="685" cy="145" r="9" fill="#34d399" stroke="#ffffff" stroke-width="2.5" />

  <!-- Bottom-Right Node -->
  <g transform="translate(570, 330)">
    <rect x="-36" y="-22" width="72" height="44" rx="10" fill="#ffffff" stroke="#b45309" stroke-width="2.5" />
    <rect x="-20" y="-6" width="40" height="6" rx="3" fill="#b45309" />
    <rect x="-14" y="4" width="28" height="5" rx="2.5" fill="#fcd34d" />
  </g>
  <circle cx="690" cy="312" r="10" fill="#d97706" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="685" cy="378" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5" />

  <!-- Top-Left Node -->
  <g transform="translate(235, 120)">
    <rect x="-36" y="-22" width="72" height="44" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5" />
    <rect x="-20" y="-6" width="40" height="6" rx="3" fill="#1d4ed8" />
    <rect x="-14" y="4" width="28" height="5" rx="2.5" fill="#93c5fd" />
  </g>
  <circle cx="120" cy="78" r="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="115" cy="145" r="9" fill="#60a5fa" stroke="#ffffff" stroke-width="2.5" />

  <!-- Bottom-Left Node -->
  <g transform="translate(230, 330)">
    <rect x="-36" y="-22" width="72" height="44" rx="10" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5" />
    <rect x="-20" y="-6" width="40" height="6" rx="3" fill="#6d28d9" />
    <rect x="-14" y="4" width="28" height="5" rx="2.5" fill="#c4b5fd" />
  </g>
  <circle cx="110" cy="312" r="10" fill="#8b5cf6" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="115" cy="378" r="9" fill="#a78bfa" stroke="#ffffff" stroke-width="2.5" />

  <!-- Central Core Synthesis Hub -->
  <g transform="translate(400, 225)">
    <circle cx="0" cy="0" r="54" fill="#0f172a" stroke="#10b981" stroke-width="3.5" />
    <circle cx="0" cy="0" r="40" fill="#1e293b" />
    <!-- Geometric Brain / Synthesis Star Emblem -->
    <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="#10b981" />
    <circle cx="0" cy="0" r="5" fill="#ecfdf5" />
  </g>
</svg>
